[package]
name = "glm53f-kda"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "GLM-5.3-Flash KDA (Kimi delta attention): fused chain and replay kernels behind a C ABI, and an f32 CPU reference"
publish = false

[lib]
name = "glm53f_kda"
path = "src/lib.rs"

[features]
default = []
# Compile and link the CUDA kernels (build.rs; needs nvcc, and a GPU to run them). Off by
# default, so `cargo test` needs no CUDA toolkit.
cuda = []

[[example]]
name = "kda_bench"
required-features = ["cuda"]
