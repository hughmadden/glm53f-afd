# glm53f-afd Rust workspace. Crates are glm53f-*; each crate that copies code from
# another project records it in its PROVENANCE.md, consolidated into docs/REUSE.md.
# No external Rust crates: the engine builds from this repository and the CUDA toolkit.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
# The rustc the release was built with, on the x86-64 and the arm64 host alike; no older one is tried.
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/hughmadden/glm53f-afd"
